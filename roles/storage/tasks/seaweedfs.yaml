---
# -------------------------------------------------------------
# SeaweedFS Installation & Configuration
# -------------------------------------------------------------
- name: Download latest SeaweedFS release binary for Linux AMD64
  ansible.builtin.get_url:
    url: "https://github.com/seaweedfs/seaweedfs/releases/latest/download/linux_amd64.tar.gz"
    dest: /tmp/seaweedfs.tar.gz
    mode: '0644'

- name: Extract SeaweedFS executable to /usr/local/bin
  ansible.builtin.unarchive:
    src: /tmp/seaweedfs.tar.gz
    dest: /usr/local/bin/
    remote_src: yes
    mode: '0755'

- name: Create SeaweedFS system group
  ansible.builtin.group:
    name: seaweedfs
    state: present
    system: yes

- name: Create SeaweedFS system user
  ansible.builtin.user:
    name: seaweedfs
    group: seaweedfs
    system: yes
    shell: /usr/sbin/nologin
    create_home: no

- name: Ensure SeaweedFS storage and metadata directories exist on ZFS
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: seaweedfs
    group: seaweedfs
    mode: '0755'
  loop:
    - "{{ zfs_secrets.zfs_mount_point | default('/mnt/' ~ zfs_secrets.zfs_pool_name) }}/seaweedfs/data"
    - "{{ zfs_secrets.zfs_mount_point | default('/mnt/' ~ zfs_secrets.zfs_pool_name) }}/seaweedfs/filerldb"
    - /etc/seaweedfs

- name: Check if SeaweedFS systemd service file exists
  ansible.builtin.stat:
    path: /etc/systemd/system/seaweedfs.service
  register: seaweedfs_service_stat

- name: Create SeaweedFS systemd service from template
  ansible.builtin.template:
    src: seaweedfs.service.j2
    dest: /etc/systemd/system/seaweedfs.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart SeaweedFS service

- name: Enable and start SeaweedFS service
  ansible.builtin.systemd_service:
    name: seaweedfs
    state: started
    enabled: true
    daemon_reload: yes

# -------------------------------------------------------------
# Append SeaweedFS Ingress Rules to Cloudflare Tunnel Config
# -------------------------------------------------------------
- name: Check if Cloudflare Tunnel configuration file exists
  ansible.builtin.stat:
    path: /etc/cloudflared/config.yml
  register: cloudflared_config_stat

- name: Append SeaweedFS endpoints to Cloudflare Tunnel ingress configuration
  ansible.builtin.blockinfile:
    path: /etc/cloudflared/config.yml
    insertbefore: '^\s*-\s*service:\s*http_status:404'
    marker: "  # {mark} ANSIBLE MANAGED BLOCK: SEAWEEDFS INGRESS"
    block: |
        # SeaweedFS S3 API Gateway
        - hostname: s3.{{ cloudflare_secrets.DOMAIN }}
          service: http://localhost:8333

        # SeaweedFS Filer GUI
        - hostname: filer.{{ cloudflare_secrets.DOMAIN }}
          service: http://localhost:8888

        # SeaweedFS Master UI
        - hostname: seaweed.{{ cloudflare_secrets.DOMAIN }}
          service: http://localhost:9333
  when: cloudflared_config_stat.stat.exists
  notify: Restart Cloudflared service

- name: Append SeaweedFS endpoints to Cloudflare Tunnel ingress configuration
  ansible.builtin.blockinfile:
    path: /etc/cloudflared/config.yml
    insertbefore: '^\s*-\s*service:\s*http_status:404'
    marker: "  # {mark} ANSIBLE MANAGED BLOCK: SEAWEEDFS INGRESS"
    block: "  # SeaweedFS S3 API Gateway\n  - hostname: s3.{{ cloudflare_secrets.DOMAIN }}\n    service: http://{{ ansible_facts['default_ipv4']['address'] }}:8333\n\n  # SeaweedFS Filer GUI\n  - hostname: filer.{{ cloudflare_secrets.DOMAIN }}\n    service: http://{{ ansible_facts['default_ipv4']['address'] }}:8888\n\n  # SeaweedFS Master UI\n  - hostname: seaweed.{{ cloudflare_secrets.DOMAIN }}\n    service: http://{{ ansible_facts['default_ipv4']['address'] }}:9333"
  when: cloudflared_config_stat.stat.exists
  notify: Restart Cloudflared service

- name: Ensure CNAME DNS records point to Cloudflare Tunnel
  community.general.cloudflare_dns:
    zone: "{{ cloudflare_secrets.DOMAIN }}"
    name: "{{ item }}"
    type: CNAME
    content: "{{ cloudflare_creds_json.TunnelID }}.cfargotunnel.com"
    proxied: true
    state: present
    api_token: "{{ cloudflare_secrets.API_TOKEN }}"
  loop:
    - "s3"
    - "filer"
    - "seaweed"