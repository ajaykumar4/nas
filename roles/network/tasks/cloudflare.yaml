---
# ==========================================
# CLOUDFLARED
# ==========================================
- name: Load Cloudflare SOPS secrets
  community.sops.load_vars:
    file: "{{ role_path }}/vars/cloudflare.sops.yaml"
    name: cloudflare_secrets

- name: Decode Tunnel Token into local credentials structure
  ansible.builtin.set_fact:
    cloudflare_creds_json:
      AccountTag: "{{ (cloudflare_secrets.TUNNEL_TOKEN | b64decode | from_json).a }}"
      TunnelID: "{{ (cloudflare_secrets.TUNNEL_TOKEN | b64decode | from_json).t }}"
      TunnelSecret: "{{ (cloudflare_secrets.TUNNEL_TOKEN | b64decode | from_json).s }}"

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download official Cloudflare GPG key
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /etc/apt/keyrings/cloudflare-main.gpg
    owner: root
    group: root
    mode: '0644'

- name: Add official Cloudflare APT repository
  ansible.builtin.deb822_repository:
    name: cloudflared
    types: deb
    uris: https://pkg.cloudflare.com/cloudflared
    suites: any
    components: main
    signed_by: /etc/apt/keyrings/cloudflare-main.gpg
    state: present
  register: cloudflared_repo

- name: Update APT cache if Cloudflare repository changed
  ansible.builtin.apt:
    update_cache: yes
  when: cloudflared_repo.changed

- name: Install Cloudflared package
  ansible.builtin.apt:
    name: cloudflared
    state: present

- name: Ensure Cloudflared runtime configuration directory exists
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Write local credentials file on host
  ansible.builtin.copy:
    content: "{{ cloudflare_creds_json | to_nice_json }}"
    dest: "/etc/cloudflared/{{ cloudflare_creds_json.TunnelID }}.json"
    owner: root
    group: root
    mode: '0600'

- name: Deploy Cloudflared ingress configuration from template
  ansible.builtin.template:
    src: cloudflared-config.yml.j2
    dest: /etc/cloudflared/config.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart Cloudflared service

- name: Check if Cloudflared systemd service exists
  ansible.builtin.stat:
    path: /etc/systemd/system/cloudflared.service
  register: cloudflared_service_stat

- name: Install Cloudflared connector service
  ansible.builtin.command:
    cmd: "cloudflared service install {{ cloudflare_secrets.TUNNEL_TOKEN }}"
  when: not cloudflared_service_stat.stat.exists
  no_log: true

- name: Enable and start Cloudflared service
  ansible.builtin.systemd_service:
    name: cloudflared
    state: started
    enabled: true