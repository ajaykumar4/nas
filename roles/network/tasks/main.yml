---
- name: Load network role SOPS secrets
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/secrets.sops.yml"
    name: network_secrets
  vars:
    # Read and decrypt using community.sops
    ansible_sops_decrypted: "{{ lookup('community.sops.sops', role_path + '/vars/secrets.sops.yml') }}"

# --- TAILSCALE ---
- name: Add Tailscale YUM repository
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/rhel/9/tailscale.repo
    dest: /etc/yum.repos.d/tailscale.repo
    owner: root
    group: root
    mode: '0644'

- name: Install Tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present

- name: Enable and start Tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true

- name: Check Tailscale login status
  ansible.builtin.command:
    cmd: tailscale status
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Authenticate Tailscale node
  ansible.builtin.command:
    cmd: "tailscale up --authkey={{ secrets.tailscale_authkey }}"
  when: "'Logged out' in tailscale_status.stdout or tailscale_status.rc != 0"
  no_log: true

# --- CLOUDFLARED ---
- name: Add Cloudflare Tunnel YUM repository
  ansible.builtin.yum_repository:
    name: cloudflare
    description: Cloudflare Official Repository
    baseurl: https://pkg.cloudflare.com/cloudflared/rpm/x86_64
    gpgcheck: true
    gpgkey: https://pkg.cloudflare.com/cloudflared/cloudflared-askmonty.pub
    enabled: true

- name: Install Cloudflared
  ansible.builtin.dnf:
    name: cloudflared
    state: present

- name: Install Cloudflared connector service
  ansible.builtin.command:
    cmd: "cloudflared service install {{ secrets.cloudflared_token }}"
  args:
    creates: /etc/systemd/system/cloudflared.service
  no_log: true

- name: Enable and start Cloudflared service
  ansible.builtin.systemd:
    name: cloudflared
    state: started
    enabled: true